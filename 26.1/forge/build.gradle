plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}

base {
    archivesName = "${mod_id}-forge-26.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version_26 as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version_26 as int
}

tasks.named('compileJava') {
    dependsOn(':26.1:neoforge:createMinecraftArtifacts')
}

sourceSets.main.resources {
    srcDir project(':common').file('src/main/resources')
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://maven.neoforged.net/releases/" }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

def neoforgeArtifacts = "${project(':26.1:neoforge').projectDir}/build/moddev/artifacts"
def forgeCache = "${System.getProperty('user.home')}/.gradle/caches/forge_gradle/maven_downloader/net/minecraftforge/forge/${minecraft_version_26}-${forge_version_26}"
def forgeMcRepo = "${System.getProperty('user.home')}/.gradle/caches/forge_gradle/minecraft_repo/versions/${minecraft_version_26}"

dependencies {
    // 26.1 Deobfuscated Minecraft jar for compilation
    if (file("${neoforgeArtifacts}/minecraft-patched-26.1.2.71.jar").exists()) {
        compileOnly files("${neoforgeArtifacts}/minecraft-patched-26.1.2.71.jar")
        compileOnly "net.neoforged:neoforge:26.1.2.71"
    }
    // Runtime vanilla Minecraft client jar
    if (file("${forgeMcRepo}/client.jar").exists()) {
        runtimeOnly files("${forgeMcRepo}/client.jar")
    } else {
        runtimeOnly files("${System.getProperty('user.home')}/.gradle/caches/neoformruntime/artifacts/minecraft_26.1.2_client.jar")
    }

    // Minecraft 26.1.2 Core Libraries
    implementation 'com.mojang:authlib:7.0.63'
    implementation 'com.mojang:datafixerupper:9.0.19'
    implementation 'com.mojang:brigadier:1.3.10'
    implementation 'com.mojang:logging:1.6.11'
    implementation 'com.mojang:blocklist:1.0.10'
    implementation 'com.mojang:patchy:2.2.10'
    implementation 'com.mojang:text2speech:1.18.11'
    implementation 'com.mojang:jtracy:1.0.37'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.google.guava:guava:33.5.0-jre'
    implementation 'it.unimi.dsi:fastutil:8.5.18'
    implementation 'org.joml:joml:1.10.8'
    implementation 'org.jspecify:jspecify:1.0.0'
    implementation 'com.ibm.icu:icu4j:77.1'
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    implementation 'commons-codec:commons-codec:1.19.0'
    implementation 'commons-io:commons-io:2.20.0'
    implementation 'org.apache.commons:commons-lang3:3.19.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'com.github.oshi:oshi-core:6.9.0'
    implementation 'net.java.dev.jna:jna:5.17.0'
    implementation 'net.java.dev.jna:jna-platform:5.17.0'
    implementation 'at.yawk.lz4:lz4-java:1.10.1'
    implementation 'com.azure:azure-json:1.4.0'
    implementation 'com.microsoft.azure:msal4j:1.23.1'
    implementation 'org.jcraft:jorbis:0.0.17'

    // Netty
    implementation 'io.netty:netty-buffer:4.2.7.Final'
    implementation 'io.netty:netty-codec-base:4.2.7.Final'
    implementation 'io.netty:netty-codec-compression:4.2.7.Final'
    implementation 'io.netty:netty-codec-http:4.2.7.Final'
    implementation 'io.netty:netty-common:4.2.7.Final'
    implementation 'io.netty:netty-handler:4.2.7.Final'
    implementation 'io.netty:netty-resolver:4.2.7.Final'
    implementation 'io.netty:netty-transport:4.2.7.Final'
    implementation 'io.netty:netty-transport-classes-epoll:4.2.7.Final'
    implementation 'io.netty:netty-transport-classes-kqueue:4.2.7.Final'
    implementation 'io.netty:netty-transport-native-unix-common:4.2.7.Final'

    // Logging & Terminal
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.apache.logging.log4j:log4j-api:2.25.2'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.2'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.2'
    implementation 'org.jline:jline-reader:3.26.1'
    implementation 'org.jline:jline-terminal:3.26.1'

    // LWJGL
    implementation 'org.lwjgl:lwjgl:3.4.1'
    implementation 'org.lwjgl:lwjgl-freetype:3.4.1'
    implementation 'org.lwjgl:lwjgl-glfw:3.4.1'
    implementation 'org.lwjgl:lwjgl-jemalloc:3.4.1'
    implementation 'org.lwjgl:lwjgl-openal:3.4.1'
    implementation 'org.lwjgl:lwjgl-opengl:3.4.1'
    implementation 'org.lwjgl:lwjgl-stb:3.4.1'
    implementation 'org.lwjgl:lwjgl-tinyfd:3.4.1'

    // LWJGL Natives
    runtimeOnly 'org.lwjgl:lwjgl:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-freetype:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-glfw:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-jemalloc:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-openal:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-opengl:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-stb:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-tinyfd:3.4.1:natives-windows'

    // Forge Loader & Bootstrap
    implementation 'net.minecraftforge:bootstrap:2.1.8'
    implementation 'net.minecraftforge:bootstrap-api:2.1.8'
    implementation 'net.minecraftforge:modlauncher:10.2.6'
    implementation "net.minecraftforge:fmlloader:${minecraft_version_26}-${forge_version_26}"
    implementation "net.minecraftforge:fmlcore:${minecraft_version_26}-${forge_version_26}"
    implementation "net.minecraftforge:javafmllanguage:${minecraft_version_26}-${forge_version_26}"
    implementation "net.minecraftforge:mclanguage:${minecraft_version_26}-${forge_version_26}"
    implementation "net.minecraftforge:forgespi:8.0.0"
    implementation "net.minecraftforge:eventbus:7.0.5"
    implementation "net.minecraftforge:securemodules:2.2.24"
    implementation "net.minecraftforge:accesstransformers:8.2.17"
    implementation "com.electronwill.night-config:toml:3.7.4"
    implementation "com.electronwill.night-config:core:3.7.4"

    // Forge 26.1 Universal
    if (file("${forgeCache}/forge-${minecraft_version_26}-${forge_version_26}-universal.jar").exists()) {
        implementation files("${forgeCache}/forge-${minecraft_version_26}-${forge_version_26}-universal.jar")
    } else {
        implementation "net.minecraftforge:forge:1.21.1-52.1.0:universal"
    }

    implementation "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
    compileOnly "org.jetbrains:annotations:24.1.0"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    implementation project(':common')

    compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"
    compileOnly "io.github.llamalad7:mixinextras-forge:0.5.4"
}

tasks.register('runClient', JavaExec) {
    group = 'runs'
    description = 'Runs the client Minecraft run configuration.'
    dependsOn classes
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(project.java_version_26 as int)
    }
    workingDir = file('run')
    doFirst {
        file('run').mkdirs()
        def dummyAssets = file('build/dummy_assets')
        def assetsSubDir = new File(dummyAssets, 'assets')
        assetsSubDir.mkdirs()
        new File(assetsSubDir, '.mcassetsroot').createNewFile()
    }
    jvmArgs = [
        '--enable-native-access=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.net=ALL-UNNAMED',
        '--add-opens=java.base/java.security=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/sun.security.util=ALL-UNNAMED'
    ]
    args = [
        '--launchTarget', 'forge_dev_client',
        '--launchEntry', 'net.minecraft.client.main.Main',
        '--version', project.minecraft_version_26,
        '--assetIndex', '30',
        '--assetsDir', "${System.getProperty('user.home')}/.gradle/caches/neoformruntime/assets"
    ]
    classpath = files(file('build/dummy_assets')) + sourceSets.main.runtimeClasspath
    mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
}

processResources {
    var replaceProperties = [
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_license: mod_license
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
