plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24, 6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-forge-26.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version_26 as int)
    }
}

// Auto-patch 26.1.2 client_mappings metadata for ForgeGradle.
// Minecraft 26.1.2 is pre-mapped by Mojang, so Mojang's official version manifest omits client_mappings.
// ForgeGradle 6.0 expects an entry in version.json and client_mappings.txt.
tasks.matching { it.name == 'extractSrg' }.configureEach {
    doFirst {
        def gradleCaches = gradle.gradleUserHomeDir
        def fgCaches = new File(gradleCaches, "caches/forge_gradle")
        def versionDirs = [
            new File(fgCaches, "minecraft_repo/versions/${minecraft_version_26}"),
            new File(fgCaches, "mcp_repo/versions/${minecraft_version_26}")
        ]
        versionDirs.each { dir ->
            if (dir.exists()) {
                def vjson = new File(dir, "version.json")
                if (vjson.exists()) {
                    def text = vjson.text
                    if (!text.contains('"client_mappings"')) {
                        def slurper = new groovy.json.JsonSlurper()
                        def json = slurper.parseText(text)
                        if (json.downloads != null && json.downloads.client_mappings == null) {
                            json.downloads.client_mappings = [
                                sha1: "da39a3ee5e6b4b0d3255bfef95601890afd80709",
                                size: 0,
                                url: "https://piston-data.mojang.com/v1/objects/da39a3ee5e6b4b0d3255bfef95601890afd80709/client.txt"
                            ]
                            vjson.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
                        }
                    }
                }
                def mappingFile = new File(dir, "client_mappings.txt")
                if (!mappingFile.exists()) {
                    mappingFile.createNewFile()
                    new File(dir, "client_mappings.txt.sha1").text = "da39a3ee5e6b4b0d3255bfef95601890afd80709"
                }
            }
        }
    }
}

// Merge the resources and classes into the same directory for Forge 1.20.2+ module system.
sourceSets.configureEach {
    def dir = layout.buildDirectory.dir("sourcesSets/$name")
    output.resourcesDir = dir
    java.destinationDirectory = dir
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version_26}"

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources {
    srcDir project(':common').file('src/main/resources')
}

mixin {
    add sourceSets.main, "zap_hosting_server_integration_menu.refmap.json"
    config "zap_hosting_server_integration_menu.mixins.json"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'zap_hosting_server_integration_menu.mixins.json'
        ])
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version_26}-${forge_version_26}"

    implementation project(':common')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    var replaceProperties = [
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_license: mod_license
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
