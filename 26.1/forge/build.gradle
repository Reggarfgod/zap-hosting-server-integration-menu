plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

// Load common properties from root gradle.properties
def rootPropsFile = file("../../gradle.properties")
if (rootPropsFile.exists()) {
    def props = new Properties()
    rootPropsFile.withInputStream { props.load(it) }
    props.each { k, v ->
        if (!project.hasProperty(k)) {
            project.ext.set(k, v)
        }
    }
}

base {
    archivesName = "${mod_id}-forge-26.1"
}

version = project.findProperty('mod_version') ?: '1.101.2'
group = project.findProperty('mod_group_id') ?: 'com.reggarf.mods'

// Mojang ships Java 25 to end users in 26.1+, so your mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of((project.findProperty('java_version_26') ?: 25) as int)

// Merge resources and classes into the same directory for Forge mod scanning in dev
sourceSets.configureEach {
    def dir = layout.buildDirectory.dir("sourceSets/$name")
    output.resourcesDir = dir
    java.destinationDirectory = dir
}

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'false'
            systemProperty 'forge.enabledGameTestNamespaces', "${mod_id}"
            args '--mixin.config', "${mod_id}.mixins.json"
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', "${mod_id}", '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

def forgeDep = project.findProperty('forge_full_version_26') ?: "${project.findProperty('minecraft_version_26_forge') ?: '26.1.2'}-${project.findProperty('forge_version_26') ?: '64.1.3'}"

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forgeDep}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'

    compileOnly "org.jetbrains:annotations:24.1.0"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"
    compileOnly "io.github.llamalad7:mixinextras-forge:0.5.4"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.4"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    var replaceProperties = [
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_license: mod_license
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'zap_hosting_server_integration_menu.mixins.json'
        ])
    }
}
