plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}

base {
    archivesName = "${mod_id}-forge-26.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version_26 as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version_26 as int
}

sourceSets.main.resources {
    srcDir project(':common').file('src/main/resources')
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://maven.minecraftforge.net/" }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // 26.1 Minecraft client jar & libraries
    compileOnly files("${System.getProperty('user.home')}/.gradle/caches/neoformruntime/artifacts/minecraft_26.1.2_client.jar")
    runtimeOnly files("${System.getProperty('user.home')}/.gradle/caches/neoformruntime/artifacts/minecraft_26.1.2_client.jar")

    compileOnly "net.minecraftforge:fmlloader:${minecraft_version_26}-${forge_version_26}"
    compileOnly "net.minecraftforge:fmlcore:${minecraft_version_26}-${forge_version_26}"
    compileOnly "net.minecraftforge:javafmllanguage:${minecraft_version_26}-${forge_version_26}"
    compileOnly "net.minecraftforge:forgespi:8.0.0"
    compileOnly "net.minecraftforge:eventbus:6.2.27"

    // Fallback Forge API classes for networking / event bus if not in 26.1 jars
    compileOnly "net.minecraftforge:forge:1.21.1-52.1.0:universal"

    compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
    compileOnly "com.google.code.gson:gson:2.13.2"
    compileOnly "io.netty:netty-all:4.1.97.Final"
    compileOnly "com.mojang:authlib:7.0.63"
    compileOnly "com.mojang:logging:1.6.11"
    compileOnly "com.mojang:brigadier:1.3.10"
    compileOnly "com.mojang:datafixerupper:9.0.19"
    compileOnly "org.joml:joml:1.10.8"
    compileOnly "it.unimi.dsi:fastutil:8.5.18"
    compileOnly "org.slf4j:slf4j-api:2.0.17"
    compileOnly "org.jetbrains:annotations:24.1.0"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    implementation project(':common')

    compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"
    compileOnly "io.github.llamalad7:mixinextras-forge:0.5.4"
}

tasks.register('runClient', JavaExec) {
    group = 'runs'
    description = 'Runs the client Minecraft run configuration.'
    dependsOn classes
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(project.java_version_26 as int)
    }
    workingDir = file('run')
    doFirst {
        file('run').mkdirs()
    }
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
}

processResources {
    var replaceProperties = [
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_license: mod_license
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
