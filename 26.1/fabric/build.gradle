plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}

base {
    archivesName = "${mod_id}-fabric-26.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version_26 as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version_26 as int
}

sourceSets.main.resources {
    srcDir project(':common').file('src/main/resources')
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // 26.1 Minecraft client jar
    implementation files("${System.getProperty('user.home')}/.gradle/caches/neoformruntime/artifacts/minecraft_26.1.2_client.jar")

    // Minecraft 26.1.2 Core Libraries
    implementation 'com.mojang:authlib:7.0.63'
    implementation 'com.mojang:datafixerupper:9.0.19'
    implementation 'com.mojang:brigadier:1.3.10'
    implementation 'com.mojang:logging:1.6.11'
    implementation 'com.mojang:blocklist:1.0.10'
    implementation 'com.mojang:patchy:2.2.10'
    implementation 'com.mojang:text2speech:1.18.11'
    implementation 'com.mojang:jtracy:1.0.37'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.google.guava:guava:33.5.0-jre'
    implementation 'it.unimi.dsi:fastutil:8.5.18'
    implementation 'org.joml:joml:1.10.8'
    implementation 'org.jspecify:jspecify:1.0.0'
    implementation 'com.ibm.icu:icu4j:77.1'
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    implementation 'commons-codec:commons-codec:1.19.0'
    implementation 'commons-io:commons-io:2.20.0'
    implementation 'org.apache.commons:commons-lang3:3.19.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'com.github.oshi:oshi-core:6.9.0'
    implementation 'net.java.dev.jna:jna:5.17.0'
    implementation 'net.java.dev.jna:jna-platform:5.17.0'
    implementation 'at.yawk.lz4:lz4-java:1.10.1'
    implementation 'com.azure:azure-json:1.4.0'
    implementation 'com.microsoft.azure:msal4j:1.23.1'
    implementation 'org.jcraft:jorbis:0.0.17'

    // Netty
    implementation 'io.netty:netty-buffer:4.2.7.Final'
    implementation 'io.netty:netty-codec-base:4.2.7.Final'
    implementation 'io.netty:netty-codec-compression:4.2.7.Final'
    implementation 'io.netty:netty-codec-http:4.2.7.Final'
    implementation 'io.netty:netty-common:4.2.7.Final'
    implementation 'io.netty:netty-handler:4.2.7.Final'
    implementation 'io.netty:netty-resolver:4.2.7.Final'
    implementation 'io.netty:netty-transport:4.2.7.Final'
    implementation 'io.netty:netty-transport-classes-epoll:4.2.7.Final'
    implementation 'io.netty:netty-transport-classes-kqueue:4.2.7.Final'
    implementation 'io.netty:netty-transport-native-unix-common:4.2.7.Final'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.apache.logging.log4j:log4j-api:2.25.2'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.2'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.2'

    // LWJGL
    implementation 'org.lwjgl:lwjgl:3.4.1'
    implementation 'org.lwjgl:lwjgl-freetype:3.4.1'
    implementation 'org.lwjgl:lwjgl-glfw:3.4.1'
    implementation 'org.lwjgl:lwjgl-jemalloc:3.4.1'
    implementation 'org.lwjgl:lwjgl-openal:3.4.1'
    implementation 'org.lwjgl:lwjgl-opengl:3.4.1'
    implementation 'org.lwjgl:lwjgl-stb:3.4.1'
    implementation 'org.lwjgl:lwjgl-tinyfd:3.4.1'

    // LWJGL Natives
    runtimeOnly 'org.lwjgl:lwjgl:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-freetype:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-glfw:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-jemalloc:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-openal:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-opengl:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-stb:3.4.1:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-tinyfd:3.4.1:natives-windows'

    // Fabric
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version_26}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_26}"
    implementation "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    implementation project(':common')

    compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"
}

tasks.register('runClient', JavaExec) {
    group = 'runs'
    description = 'Runs the client Minecraft run configuration.'
    dependsOn classes
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(project.java_version_26 as int)
    }
    workingDir = file('run')
    doFirst {
        file('run').mkdirs()
    }
    jvmArgs = [
        '--enable-native-access=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.net=ALL-UNNAMED',
        '--add-opens=java.base/java.security=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/sun.security.util=ALL-UNNAMED',
        "-Dfabric.development=true"
    ]
    args = [
        '--assetIndex', '30',
        '--assetsDir', "${System.getProperty('user.home')}/.gradle/caches/neoformruntime/assets",
        '--version', project.minecraft_version_26
    ]
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
}

processResources {
    var replaceProperties = [
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_license: mod_license
    ]
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
