plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-fabric-26.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version_26 as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version_26 as int
}

sourceSets.main.resources {
    srcDir project(':common').file('src/main/resources')
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // 26.1 Minecraft client jar & libraries
    compileOnly files("${System.getProperty('user.home')}/.gradle/caches/neoformruntime/artifacts/minecraft_26.1.2_client.jar")
    
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version_26}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_26}"
    compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
    compileOnly "com.google.code.gson:gson:2.11.0"
    compileOnly "io.netty:netty-all:4.1.97.Final"
    compileOnly "com.mojang:authlib:6.0.55"
    compileOnly "com.mojang:logging:1.2.7"
    compileOnly "com.mojang:brigadier:1.3.10"
    compileOnly "com.mojang:datafixerupper:8.0.16"
    compileOnly "org.joml:joml:1.10.8"
    compileOnly "it.unimi.dsi:fastutil:8.5.15"
    compileOnly "org.slf4j:slf4j-api:2.0.9"
    compileOnly "org.jetbrains:annotations:24.1.0"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    implementation project(':common')

    compileOnly "io.github.llamalad7:mixinextras-common:0.4.1"
    compileOnly "io.github.llamalad7:mixinextras-fabric:0.4.1"
}

processResources {
    var replaceProperties = [
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_license: mod_license
    ]
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
