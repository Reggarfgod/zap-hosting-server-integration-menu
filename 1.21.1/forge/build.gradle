plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24, 6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-forge-1.21.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }
}

// Merge the resources and classes into the same directory for Forge 1.20.2+ module system.
sourceSets.configureEach {
    def dir = layout.buildDirectory.dir("sourcesSets/$name")
    output.resourcesDir = dir
    java.destinationDirectory = dir
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources {
    srcDir project(':common').file('src/main/resources')
}

mixin {
    add sourceSets.main, "zap_hosting_server_integration_menu.refmap.json"
    config "zap_hosting_server_integration_menu.mixins.json"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'zap_hosting_server_integration_menu.mixins.json'
        ])
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version_1_21}"

    implementation project(':common')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    var replaceProperties = [
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_license: mod_license
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
